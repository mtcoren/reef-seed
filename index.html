<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reef & Seed - 100% Natural Sea Moss & Juices</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#FFFEF8;color:#1a2e1a}
h1,h2{font-family:'Playfair Display',serif}
.hero{min-height:90vh;background:linear-gradient(180deg,#f7f3e8 0%,#e8f5d8 100%);display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.logo-badge{width:380px;height:380px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 8px 30px rgba(0,0,0,0.12);border:4px solid #d4af37;overflow:hidden;padding:0}
.logo-badge img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tag{display:inline-block;background:#14532d;color:#fff;padding:8px 20px;border-radius:999px;font-size:13px;letter-spacing:0.15em;font-weight:700;margin-bottom:18px}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:0.9;color:#14532d;margin-bottom:12px}
.hero h1 span{color:#d4af37;display:block;font-size:0.6em;font-family:'Inter';font-weight:700;letter-spacing:0.2em;margin-top:8px}
.hero p{max-width:600px;margin:18px auto 28px;color:#4a6741;font-size:19px;line-height:1.6}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{padding:14px 32px;border-radius:999px;font-weight:700;text-decoration:none;display:inline-block}
.btn-primary{background:#14532d;color:#fff} .btn-secondary{background:#fff;color:#14532d;border:2px solid #14532d}
.products{padding:80px 20px;max-width:1200px;margin:0 auto}
.section-tag{text-align:center;color:#d4af37;font-weight:700;letter-spacing:0.2em;font-size:12px;margin-bottom:12px}
.products h2{text-align:center;font-size:clamp(32px,5vw,48px);color:#14532d;margin-bottom:12px}
.products .sub{text-align:center;color:#6b8a63;max-width:600px;margin:0 auto 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 10px 40px rgba(20,83,45,0.08);border:1px solid #e8e8d5}
.card img{width:100%;height:300px;object-fit:cover;background:#f7f3e8}
.card-body{padding:20px 22px 24px}
.footer{background:#14532d;color:#d1e7c9;padding:40px 20px;text-align:center;margin-top:60px}
</style>
</head>
