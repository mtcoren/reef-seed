<!DOCTYPE html>
<!-- Reef & Seed BIG LOGO 380px v101 - light deploy -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reef & Seed - 100% Natural Sea Moss & Juices</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#FFFEF8;color:#1a2e1a}
h1,h2{font-family:'Playfair Display',serif}
.hero{min-height:90vh;background:linear-gradient(180deg,#f7f3e8 0%,#e8f5d8 100%);display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}

.logo-badge img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tag{display:inline-block;background:#14532d;color:#fff;padding:8px 20px;border-radius:999px;font-size:13px;letter-spacing:0.15em;font-weight:700;margin-bottom:18px}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:0.9;color:#14532d;margin-bottom:12px}
.hero h1 span{color:#d4af37;display:block;font-size:0.6em;font-family:'Inter';font-weight:700;letter-spacing:0.2em;margin-top:8px}
.hero p{max-width:600px;margin:18px auto 28px;color:#4a6741;font-size:19px;line-height:1.6}
.footer{background:#14532d;color:#d1e7c9;padding:40px 20px;text-align:center;margin-top:60px}
</style>
</head>
<body>
<section class="hero">
<div>
<div class="logo-badge"><img src="reef-seed-fruits-logo.png" alt="Reef & Seed Logo"></div>
<div class="tag">WILD HARVESTED FROM ST. LUCIA</div>
<h1>REEF & SEED <span>100% NATURAL</span></h1>
<p>Premium Sea Moss gels and cold-pressed juices. No added sugar, non-GMO, plant-based, and naturally nourishing.</p>
</div>
</section>
<div class="footer"><h2 style="color:#fff">Reef & Seed</h2><p>100% Natural Sea Moss</p></div>
</body>
</html>
